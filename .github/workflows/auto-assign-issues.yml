name: Auto-Assign and Label Issues
on:
  schedule:
    - cron: '0 6-23 * * *' # Every hour from 6 AM to 11 PM
  workflow_dispatch:      # Allows manual trigger

env:
  PROJECT_ID: 'PVT_kwDOBB_QEs4A7nWD'
  STATUS_FIELD_ID: 'PVTSSF_lADOBB_QEs4A7nWDzgv3CYI'
  TO_DO_OPTION_ID: 'b0406991'
  BOT_USERNAME: 'agrosphere-bot'
  DEFAULT_PHASE_LABEL: 'phase/design'
  DEFAULT_PRIORITY_LABEL: 'priority/med'

jobs:
  auto-assigner:
    name: Auto-Assign and Label Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch Project Items
        id: fetch_items
        env:
          GITHUB_TOKEN: ${{ secrets.LIVEFARM_BOT_GITHUB_TOKEN }}
        run: |
          echo "Fetching project items from GitHub..."
          response=$(gh api graphql -f query='
            query($project_id: ID!) {
              node(id: $project_id) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          number
                          repository { name owner { login } }
                          assignees(first: 1) { nodes { login } }
                          labels(first: 10) { nodes { name } }
                        }
                        ... on PullRequest {
                          number
                          repository { name owner { login } }
                          assignees(first: 1) { nodes { login } }
                          labels(first: 10) { nodes { name } }
                        }
                      }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' -f project_id=$PROJECT_ID)
          echo "$response" > items.json

      - name: Process Issues
        env:
          GITHUB_TOKEN: ${{ secrets.LIVEFARM_BOT_GITHUB_TOKEN }}
        run: |
          phases=("phase/design" "phase/frontend-development" "phase/api-development" "phase/backend-integration")

          declare -A assignments
          while IFS=',' read -r tag status assignee; do
            clean_key="$(echo -n $tag | xargs),$(echo -n $status | xargs)"
            assignments["$clean_key"]=$(echo -n $assignee | xargs)
          done < <(tail -n +2 .github/workflows/assignments.csv)

          cat items.json | jq -c '.data.node.items.nodes[]' | while read item; do
            if [[ "$(echo $item | jq -r '.content // empty')" == "{}" ]]; then continue; fi
            issue_number=$(echo $item | jq -r '.content.number // empty')
            repo_owner=$(echo $item | jq -r '.content.repository.owner.login // empty')
            repo_name=$(echo $item | jq -r '.content.repository.name // empty')
            echo "repo name: '$repo_name'"
            status=$(echo $item | jq -r '.fieldValueByName.name // empty' | xargs)
            labels=$(echo $item | jq -c '.content.labels.nodes | map(.name) // empty')
            current_assignee=$(echo $item | jq -r '.content.assignees.nodes[0].login // empty')
            item_id=$(echo $item | jq -r '.id // empty')
            
            if [[ -z "$issue_number" || -z "$repo_owner" || -z "$repo_name" || -z "$item_id" || -z "$status" ]]; then
              echo "--> SKIPPING item #$issue_number due to incomplete data."
              continue
            fi
            
            echo "Processing item #$issue_number in repository $repo_owner/$repo_name with status '$status'"

            if [[ "$status" == "To Do" ]]; then
                if ! echo "$labels" | jq -e 'any(. | startswith("phase/"))' || ! echo "$labels" | jq -e 'any(. | startswith("priority/"))'; then
                    labels_to_add=()
                    if ! echo "$labels" | jq -e 'any(. | startswith("phase/"))'; then labels_to_add+=("$DEFAULT_PHASE_LABEL"); fi
                    if ! echo "$labels" | jq -e 'any(. | startswith("priority/"))'; then labels_to_add+=("$DEFAULT_PRIORITY_LABEL"); fi
                    
                    add_label_flags=""
                    for label in "${labels_to_add[@]}"; do add_label_flags+=" --add-label \"$label\""; done
                    
                    echo "Item #$issue_number needs initial labels. Applying: ${labels_to_add[*]}"
                    eval "gh issue edit \"$issue_number\" --repo \"$repo_owner/$repo_name\" $add_label_flags < /dev/null"
                    for label in "${labels_to_add[@]}"; do labels=$(echo "$labels" | jq --arg new_label "$label" '. + [$new_label]'); done
                fi

            elif [[ "$status" == "Done" ]]; then
                for label in $(echo $labels | jq -r '.[]'); do
                    if [[ "$label" == phase/* ]]; then
                        for i in "${!phases[@]}"; do
                            if [[ "${phases[$i]}" == "$label" ]]; then
                                if [[ "$i" -lt $((${#phases[@]} - 1)) ]]; then
                                    next_phase="${phases[$i+1]}"
                                    gh issue edit "$issue_number" --repo "$repo_owner/$repo_name" --remove-label "$label" --add-label "$next_phase" < /dev/null || continue
                                    gh api graphql -f query='mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) { updateProjectV2ItemFieldValue(input: { projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: { singleSelectOptionId: $optionId }}) { projectV2Item { id } } }' -f projectId=$PROJECT_ID -f itemId=$item_id -f fieldId=$STATUS_FIELD_ID -f optionId=$TO_DO_OPTION_ID < /dev/null || continue
                                    key="$next_phase,To Do"
                                    assignee="${assignments[$key]}"
                                    if [[ -n "$assignee" ]]; then gh issue edit "$issue_number" --repo "$repo_owner/$repo_name" --add-assignee "$assignee" < /dev/null; fi
                                else
                                    gh issue edit "$issue_number" --repo "$repo_owner/$repo_name" --remove-label "$label" --add-label "done" < /dev/null
                                    if [[ -n "$current_assignee" ]]; then gh issue edit "$issue_number" --repo "$repo_owner/$repo_name" --remove-assignee "$current_assignee" < /dev/null; fi
                                fi
                                break
                            fi
                        done
                    fi
                done
                continue
            fi

            # Universal Assignment Logic
            assigned=false
            for label in $(echo $labels | jq -r '.[]'); do
                clean_label="$(echo -n $label | xargs)"
                key="$clean_label,$status"
                assignee="${assignments[$key]}"
                if [[ -n "$assignee" ]]; then
                    if [[ "$current_assignee" == "$assignee" ]]; then
                        echo "Item #$issue_number is already correctly assigned to $assignee. No action needed."
                    else
                        echo "Assigning item #$issue_number to $assignee based on rule: $key"
                        gh issue edit "$issue_number" --repo "$repo_owner/$repo_name" --add-assignee "$assignee" < /dev/null
                    fi
                    assigned=true
                    break
                fi
            done

            if [[ "$assigned" == false ]]; then
                echo "No applicable assignment rule found for item #$issue_number with status '$status'."
            fi
          done
