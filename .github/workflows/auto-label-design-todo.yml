name: Auto-Label To Do Issues Without Label

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allows manual trigger

env:
  TARGET_STATUS: 'To Do'
  TARGET_LABEL: 'phase/design'
  PROJECT_ID: 'PVT_kwDOBB_QEs4A7nWD'  # Replace with your project ID

jobs:
  auto-labeler:
    name: Auto-Label Issues
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Project Items
        id: fetch_items
        env:
          GITHUB_TOKEN: ${{ secrets.LIVEFARM_BOT_GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            query($project_id: ID!) {
              node(id: $project_id) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      content {
                        ... on Issue {
                          number
                          repository {
                            name
                            owner { login }
                          }
                          labels(first: 10) {
                            nodes { name }
                          }
                        }
                      }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' -f project_id=$PROJECT_ID > items.json

      - name: Apply Label Logic
        env:
          GITHUB_TOKEN: ${{ secrets.LIVEFARM_BOT_GITHUB_TOKEN }}
          TARGET_STATUS: ${{ env.TARGET_STATUS }}
          TARGET_LABEL: ${{ env.TARGET_LABEL }}
        run: |
          cat items.json | jq -c '.data.node.items.nodes[]' | while read item; do
            issue_number=$(echo $item | jq -r '.content.number // empty')
            repo_name=$(echo $item | jq -r '.content.repository.name // empty')
            repo_owner=$(echo $item | jq -r '.content.repository.owner.login // empty')
            status=$(echo $item | jq -r '.fieldValueByName.name // empty')

            # Log items with null status or empty content
            if [[ -z "$status" || -z "$issue_number" || -z "$repo_name" ]]; then
              echo "Skipping item due to missing data: status='$status', issue_number='$issue_number', repo_name='$repo_name'"
              continue
            fi

            labels=$(echo $item | jq -r '.content.labels.nodes[].name // empty')
            has_phase_label=false
            for label in $labels; do
              if [[ $label == phase/* ]]; then
                has_phase_label=true
                break
              fi
            done

            if [[ "$status" == "$TARGET_STATUS" && "$has_phase_label" == false ]]; then
              echo "Applying label to issue #$issue_number in $repo_owner/$repo_name"
              gh issue edit "$issue_number" --repo "$repo_owner/$repo_name" --add-label "$TARGET_LABEL"
            fi
          done
